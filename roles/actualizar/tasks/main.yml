---
- name: Modificar el repositorio de Kali para que use https
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list"
    regexp: "^deb http://http.kali.org"
    line: "deb https://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware"

- name: Actualizar el índice de paquetes
  ansible.builtin.apt:
    update_cache: true

- name: Hacer un dist-upgrade
  ansible.builtin.apt:
    upgrade: dist

- name: Comprobar si es necesario reiniciar
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reiniciar el servidor si es necesario
  ansible.builtin.reboot:
  when: reiniciar_equipos == true and reboot_required_file.stat.exists == true

- name: Eliminar dependencias obsoletas
  ansible.builtin.apt:
    autoremove: true
