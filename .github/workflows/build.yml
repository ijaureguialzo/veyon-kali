name: build

# Construye los tres paquetes del proyecto:
#   * .deb arm64  (Docker, nativo en un runner ARM)
#   * .deb amd64  (Docker, nativo en un runner x86_64)
#   * bundle .app + DMG de macOS
#
# Los .deb se compilan en Docker con el mismo Makefile que en local, así que
# la CI y el puesto de trabajo hacen exactamente lo mismo.

on:
  push:
    # La rama del repositorio es "master"; se deja "main" por si se renombra.
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta v* para publicar la release (opcional)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── .deb para Kali (arm64 y amd64) ───────────────────────────────────────
  deb:
    name: .deb ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # El repositorio es público, así que el runner ARM nativo está
          # disponible y la build va sin emular.
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Cache del checkout de Veyon
        uses: actions/cache@v4
        with:
          path: build/veyon
          key: veyon-src-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            veyon-src-${{ matrix.arch }}-

      - name: Compilar el .deb
        run: make ${{ matrix.arch }}

      - name: Subir el .deb
        uses: actions/upload-artifact@v4
        with:
          name: veyon-deb-${{ matrix.arch }}
          path: package/*.deb
          if-no-files-found: error

      - name: Verificar las traducciones
        run: |
          # La aplicación muestra el idioma del sistema, pero el selector de
          # la configuración solo ofrece los idiomas traducidos, asi que el
          # paquete tiene que llevar los ficheros .qm.
          for deb in package/*.deb; do
            count=$(dpkg-deb -c "$deb" | grep -c '\.qm$')
            echo "$deb: $count traducciones"
            if [ "$count" -eq 0 ]; then
              echo "::error::el paquete no incluye las traducciones"
              exit 1
            fi
          done

  # ── Bundle y DMG de macOS ────────────────────────────────────────────────
  macos:
    name: macOS
    # Runner con Xcode 27 (arm64).  La imagen "macos-14" ya está
    # obsoleta y la de macOS 26 va con un Xcode anterior.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      # Homebrew de los runners ARM vive aquí; es el valor por omisión del
      # Makefile, pero se deja explícito por si cambia.
      PREFIX: /opt/homebrew
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Cache de las descargas de Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-veyon-macos
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Dependencias de Homebrew
        run: |
          # El upstream busca estas librerías en el sistema y aborta si no las
          # encuentra: libvncserver para el VNC, y openldap y cyrus-sasl para
          # el plugin de LDAP (los parches 0002 y 0003 los buscan en los kegs
          # de Homebrew porque son keg-only).
          # librsvg aporta rsvg-convert, que se usa para generar el icono de
          # la aplicación.
          # "qt" ya arrastra qtbase, qttools, qtshadertools, qttranslations,
          # qt5compat y qthttpserver.
          # El OpenSSL no se instala: el runner ya lo trae en /opt/homebrew/lib.
          brew install cmake ninja libvncserver openldap cyrus-sasl \
            librsvg qt qca

      - name: Herramientas de Xcode
        run: |
          # iconutil viene de las command line tools de Xcode (/usr/bin) y
          # puede no estar en el PATH si el runner no expone el shim.  Se
          # añade el directorio usr/bin del Xcode seleccionado por si acaso.
          echo "Xcode seleccionado: $(xcode-select -p)"
          echo "$(xcode-select -p)/usr/bin" >> "$GITHUB_PATH"

      - name: Cache del checkout de Veyon
        uses: actions/cache@v4
        with:
          path: build/veyon
          key: veyon-src-macos-${{ github.sha }}
          restore-keys: |
            veyon-src-macos-

      - name: Compilar el bundle y el DMG
        run: make macos

      - name: Verificar el bundle
        run: |
          codesign -dv build/veyon-macos/build/Veyon.app 2>&1 | head -5 || true
          hdiutil imageinfo build/veyon-macos/build/*.dmg >/dev/null \
            && echo "::notice::el DMG es válido"

      - name: Verificar las traducciones
        run: |
          # Las traducciones van en Contents/Resources/translations y los
          # idiomas que habla la aplicación se declaran en el Info.plist.
          count=$(ls build/veyon-macos/build/Veyon.app/Contents/Resources/translations/*.qm | wc -l)
          echo "traducciones en el bundle: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::el bundle no incluye las traducciones"
            exit 1
          fi
          plutil -extract CFBundleLocalizations raw -o - \
            build/veyon-macos/build/Veyon.app/Contents/Info.plist

      - name: Subir el DMG
        uses: actions/upload-artifact@v4
        with:
          name: veyon-macos
          path: build/veyon-macos/build/*.dmg
          if-no-files-found: error

  # ── Release con los tres paquetes ────────────────────────────────────────
  release:
    name: release
    needs: [deb, macos]
    # La release se publica cuando la ejecucion viene de una etiqueta v* o
    # cuando se pide a mano con la entrada "release_tag".
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Si la etiqueta no existe todavia, se crea apuntando al commit de
          # la ejecucion, para poder publicar la release sin tener que
          # etiquetar a mano.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Creando la etiqueta $TAG sobre $GITHUB_SHA"
            # --no-sign evita que la configuración global de git pida firmar
            # la etiqueta y abra el editor.
            git tag --no-sign "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          mapfile -t FILES < <(find dist -type f \( -name '*.deb' -o -name '*.dmg' \))
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no se ha encontrado ningún paquete que publicar"
            exit 1
          fi
          echo "Publicando ${#FILES[@]} ficheros en la release ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --generate-notes \
              --verify-tag --title "Veyon $TAG"
          fi
